<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Quiz</title>
<style>
:root {
  --red: #c0392b;
  --red-dark: #96281b;
  --black: #090909;
  --dark: #0f0f0f;
  --card: #141414;
  --border: #1e1e1e;
  --text: #d0d0d0;
  --muted: #555;
  --white: #eee;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--black); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
.wrap { width:100%; max-width:580px; }

/* START */
.start { text-align:center; }
.start-label { font-size:0.7rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--red); margin-bottom:1rem; }
.start h1 { font-size:2.8rem; font-weight:900; color:var(--white); letter-spacing:-0.03em; margin-bottom:0.75rem; }
.start p { color:var(--muted); margin-bottom:2.5rem; font-size:0.9rem; line-height:1.7; }
.start-btn { background:var(--red); color:#fff; border:none; padding:0.9rem 2.5rem; border-radius:4px; font-size:0.95rem; font-weight:700; cursor:pointer; font-family:inherit; transition:background 0.15s; }
.start-btn:hover { background:var(--red-dark); }

/* QUIZ */
.quiz { display:none; }
.quiz-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
.q-count { font-size:0.78rem; color:var(--muted); letter-spacing:0.04em; }
.timer { font-size:0.78rem; color:var(--text); font-variant-numeric:tabular-nums; }
.timer.urgent { color:var(--red); }
.progress { height:2px; background:var(--border); border-radius:1px; margin-bottom:2rem; }
.progress-fill { height:100%; background:var(--red); border-radius:1px; transition:width 0.4s ease; }

.question { font-size:1.2rem; font-weight:600; color:var(--white); line-height:1.5; margin-bottom:2rem; min-height:60px; }
.options { display:flex; flex-direction:column; gap:0.6rem; margin-bottom:2rem; }
.option {
  background:var(--card); border:1px solid var(--border);
  color:var(--text); padding:0.9rem 1.1rem;
  border-radius:4px; font-size:0.9rem; font-family:inherit;
  cursor:pointer; text-align:left; transition:border-color 0.15s,background 0.15s;
}
.option:hover:not(:disabled) { border-color:#333; background:#1a1a1a; color:var(--white); }
.option.correct { border-color:#27ae60; background:rgba(39,174,96,0.08); color:#2ecc71; }
.option.wrong { border-color:var(--red); background:var(--red-dim,rgba(192,57,43,0.08)); color:#e74c3c; }
.option:disabled { cursor:default; }
.next-btn { background:var(--red); color:#fff; border:none; padding:0.8rem 1.75rem; border-radius:4px; font-size:0.88rem; font-weight:700; cursor:pointer; font-family:inherit; display:none; transition:background 0.15s; }
.next-btn:hover { background:var(--red-dark); }

/* RESULT */
.result { display:none; text-align:center; padding:2rem 0; }
.result-score { font-size:5rem; font-weight:900; color:var(--red); line-height:1; letter-spacing:-0.04em; margin-bottom:0.5rem; }
.result-label { font-size:0.9rem; color:var(--muted); margin-bottom:2rem; }
.result-msg { font-size:1.1rem; color:var(--white); margin-bottom:2rem; }
.result-again { background:var(--red); color:#fff; border:none; padding:0.8rem 2rem; border-radius:4px; font-size:0.88rem; font-weight:700; cursor:pointer; font-family:inherit; transition:background 0.15s; }
.result-again:hover { background:var(--red-dark); }
</style>
</head>
<body>
<div class="wrap">
  <div class="start" id="startScreen">
    <div class="start-label">Knowledge test</div>
    <h1>Quiz.</h1>
    <p>10 questions. 15 seconds each.<br/>No second chances once you choose.</p>
    <button class="start-btn" onclick="startQuiz()">Start</button>
  </div>

  <div class="quiz" id="quizScreen">
    <div class="quiz-meta">
      <span class="q-count" id="qCount">1 / 10</span>
      <span class="timer" id="timer">15s</span>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQ()">Next</button>
  </div>

  <div class="result" id="resultScreen">
    <div class="result-score" id="resultScore"></div>
    <div class="result-label">out of 10</div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="result-again" onclick="startQuiz()">Try again</button>
  </div>
</div>

<script>
const Qs = [
  {q:"What is the capital of France?",o:["Berlin","Madrid","Paris","Rome"],a:2},
  {q:"What does HTML stand for?",o:["Hyper Text Markup Language","High Tech Modern Language","Home Tool Markup Language","Hyperlink Text Mode Language"],a:0},
  {q:"Which planet is the largest in our solar system?",o:["Saturn","Neptune","Jupiter","Uranus"],a:2},
  {q:"Who painted the Mona Lisa?",o:["Picasso","Da Vinci","Van Gogh","Michelangelo"],a:1},
  {q:"What is 15% of 200?",o:["25","30","35","40"],a:1},
  {q:"Which language primarily handles web page styling?",o:["HTML","JavaScript","Python","CSS"],a:3},
  {q:"Which is the largest ocean?",o:["Atlantic","Indian","Arctic","Pacific"],a:3},
  {q:"What year did the first iPhone launch?",o:["2005","2006","2007","2008"],a:2},
  {q:"What does CPU stand for?",o:["Central Processing Unit","Computer Personal Unit","Core Processing Unit","Central Program Utility"],a:0},
  {q:"How many bits are in a byte?",o:["4","8","16","32"],a:1},
];

let cur=0, score=0, timer, timeLeft, shuffled=[];

function startQuiz(){
  cur=0; score=0;
  shuffled=Qs.map((q,i)=>i).sort(()=>Math.random()-0.5).slice(0,10);
  document.getElementById('startScreen').style.display='none';
  document.getElementById('resultScreen').style.display='none';
  document.getElementById('quizScreen').style.display='block';
  showQ();
}

function showQ(){
  clearInterval(timer);
  timeLeft=15;
  const q=Qs[shuffled[cur]];
  document.getElementById('qCount').textContent=`${cur+1} / 10`;
  document.getElementById('progressFill').style.width=`${(cur/10)*100}%`;
  document.getElementById('question').textContent=q.q;
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('timer').className='timer';
  document.getElementById('timer').textContent='15s';
  const opts=document.getElementById('options');
  const order=[0,1,2,3].sort(()=>Math.random()-0.5);
  opts.innerHTML=order.map(i=>`<button class="option" onclick="pick(${i},this)">${q.o[i]}</button>`).join('');
  timer=setInterval(()=>{
    timeLeft--;
    document.getElementById('timer').textContent=timeLeft+'s';
    if(timeLeft<=5) document.getElementById('timer').className='timer urgent';
    if(timeLeft<=0){ clearInterval(timer); reveal(-1); }
  },1000);
}

function pick(idx,btn){
  clearInterval(timer);
  reveal(idx);
}

function reveal(idx){
  const q=Qs[shuffled[cur]];
  document.querySelectorAll('.option').forEach((b,i)=>{
    const val=parseInt(b.getAttribute('onclick').match(/\d+/)[0]);
    b.disabled=true;
    if(val===q.a) b.classList.add('correct');
    else if(val===idx) b.classList.add('wrong');
  });
  if(idx===q.a) score++;
  document.getElementById('nextBtn').style.display='inline-block';
}

function nextQ(){
  cur++;
  if(cur>=10) showResult();
  else showQ();
}

function showResult(){
  document.getElementById('quizScreen').style.display='none';
  const r=document.getElementById('resultScreen');
  r.style.display='block';
  document.getElementById('resultScore').textContent=score;
  const pct=(score/10)*100;
  document.getElementById('resultMsg').textContent=pct>=80?'Excellent.':pct>=60?'Not bad.':'Keep studying.';
}
</script>
</body>
</html>
